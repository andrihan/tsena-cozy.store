# Nginx d'entrée (conteneur Incus srv-nginx)
# Fichier : /etc/nginx/sites-available/dev.tsena-cozy.store
# Certbot ajoute lui-même la partie HTTPS (listen 443 + certificat).

server {
    listen 80;
    listen [::]:80;
    server_name dev.tsena-cozy.store;

    # Site de test : ne pas le faire indexer par Google
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://10.185.89.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
